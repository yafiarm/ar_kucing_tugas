<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toon Cat AR — Scan</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body class="ar-body">

  <!-- ══════════════════════════════════════════
       A-Frame AR Scene
  ══════════════════════════════════════════ -->
  <a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          detectionMode: mono_and_matrix;
          matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true;"
    style="display:none">

    <a-assets timeout="30000">
      <!-- 3D Cat model -->
      <a-asset-item id="cat-model" src="toon_cat_free.glb"></a-asset-item>

      <!-- Cat sounds -->
      <audio id="sound1" src="sound_cat_1.mp3" preload="auto" crossorigin="anonymous"></audio>
      <audio id="sound2" src="sound_cat_2.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- HIRO Marker -->
    <a-marker preset="hiro">

  <a-entity
    gltf-model="toon_cat_free.glb"
    position="0 0 0"
    rotation="0 0 0"
    scale="0.01 0.01 0.01"

    animation-mixer="loop: repeat">
  </a-entity>

</a-marker>

    <a-entity camera></a-entity>
  </a-scene>


  <!-- ══════════════════════════════════════════
       HUD Overlay
  ══════════════════════════════════════════ -->
  <div class="ar-hud" id="ar-hud" style="display:none">

    <!-- Top bar -->
    <div class="ar-topbar">
      <a href="index.html" class="ar-back">← Home</a>

      <div class="ar-title">🐱 Toon Cat AR</div>

      <div class="ar-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">MENUNGGU</span>
      </div>
    </div>

    <!-- Scan frame (center) -->
    <div class="scan-frame" id="scan-frame">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div class="scan-line"></div>
    </div>

    <!-- Bottom bar -->
    <div class="ar-bottombar">
      <p class="ar-hint" id="ar-hint">Arahkan kamera ke marker HIRO 🎯</p>

      <div class="sound-controls">
        <span class="sound-label">🔊 SUARA</span>

        <button class="sound-btn" id="mute-btn" title="Mute/Unmute">🔊</button>

        <span class="sound-track-info" id="track-info">—</span>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">📍 Marker terdeteksi!</div>


  <!-- ══════════════════════════════════════════
       Marker Guide (shown before AR starts)
  ══════════════════════════════════════════ -->
  <div class="marker-overlay" id="marker-overlay">
    <div class="marker-card">
      <div class="cat-big">🐱</div>
      <h2>Siapkan Marker HIRO</h2>
      <p>
        Cetak atau tampilkan marker di bawah ini di layar lain, lalu arahkan kamera kepadanya.
        Izinkan akses kamera ketika browser meminta.
      </p>

      <div class="marker-img-wrap">
        <img
          src="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png"
          alt="HIRO marker"
          onerror="this.src=''; this.parentElement.innerHTML='<p style=color:#333;font-size:.8rem;padding:8px>HIRO<br>MARKER</p>'" />
      </div>

      <button class="btn-start" id="start-btn">🎯 Mulai Kamera AR</button>
    </div>
  </div>


  <!-- ══════════════════════════════════════════
       Script
  ══════════════════════════════════════════ -->
  <script>
    /* ── State ── */
    const sounds      = [
      document.getElementById('sound1'),
      document.getElementById('sound2')
    ];
    let currentSound  = 0;   // index 0 or 1
    let isMuted       = false;
    let markerVisible = false;
    let soundTimer    = null;

    /* ── DOM refs ── */
    const scene        = document.getElementById('ar-scene');
    const hud          = document.getElementById('ar-hud');
    const overlay      = document.getElementById('marker-overlay');
    const startBtn     = document.getElementById('start-btn');
    const muteBtn      = document.getElementById('mute-btn');
    const scanFrame    = document.getElementById('scan-frame');
    const statusDot    = document.getElementById('status-dot');
    const statusText   = document.getElementById('status-text');
    const arHint       = document.getElementById('ar-hint');
    const toast        = document.getElementById('toast');
    const trackInfo    = document.getElementById('track-info');
    const marker       = document.getElementById('hiro-marker');

    /* ── Start AR ── */
    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      scene.style.display   = 'block';
      hud.style.display     = 'flex';
    });

    /* ── Sound helpers ── */
    function stopAllSounds() {
      sounds.forEach(s => { s.pause(); s.currentTime = 0; });
      clearTimeout(soundTimer);
    }

    function playNextSound() {
      if (isMuted || !markerVisible) return;

      stopAllSounds();
      const snd = sounds[currentSound];
      trackInfo.textContent = `Track ${currentSound + 1}/2`;

      snd.play().catch(() => {});   // autoplay may need user gesture first

      snd.onended = () => {
        if (!markerVisible || isMuted) return;
        // small pause between sounds
        soundTimer = setTimeout(() => {
          currentSound = (currentSound + 1) % 2;
          playNextSound();
        }, 800);
      };
    }

    /* ── Mute toggle ── */
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
      muteBtn.classList.toggle('muted', isMuted);

      if (isMuted) {
        stopAllSounds();
        trackInfo.textContent = 'Muted';
      } else if (markerVisible) {
        playNextSound();
      }
    });

    /* ── Marker found / lost ── */
    marker.addEventListener('markerFound', () => {
      markerVisible = true;

      // Update HUD
      statusDot.classList.add('found');
      statusText.textContent = 'KUCING MUNCUL';
      arHint.textContent     = '🐱 Kucing terdeteksi! Jaga marker terlihat.';

      // Hide scan frame
      scanFrame.style.opacity = '0';
      scanFrame.style.transition = 'opacity .4s';

      // Show toast
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2500);

      // Start sounds
      currentSound = 0;
      playNextSound();
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;

      // Update HUD
      statusDot.classList.remove('found');
      statusText.textContent = 'MENUNGGU';
      arHint.textContent     = 'Arahkan kamera ke marker HIRO 🎯';

      // Show scan frame again
      scanFrame.style.opacity = '1';

      // Stop sounds
      stopAllSounds();
      trackInfo.textContent = '—';
    });

    /* ── Model load fallback notice ── */
    document.getElementById('cat-entity').addEventListener('model-error', () => {
      console.warn(
        '[AR] toon_cat_free.glb tidak ditemukan. ' +
        'Pastikan file ada di folder yang sama dengan ar.html.'
      );
    });
  </script>

</body>
</html>
